
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CinéTrack - Catalogue de films et séries.">

    <title>CinéTrack : catalogue de films et séries</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="min-h-screen">

    <!-- Background Image -->
    <img
        src="./img/eb5cea72bb9b8662721961c8e71c83b2.gif"
        alt="Cinema Background"
        class="fixed inset-0 w-full h-full object-cover -z-10"
    >

    <!-- Dark Overlay -->
    <div class="fixed inset-0 bg-black/60 -z-10"></div>

    <!-- HEADER -->
    <header class="relative z-10 bg-gray-950/90 border-b border-gray-800 px-6 py-4">

        <div class="max-w-7xl mx-auto flex items-center justify-between">

            <!-- Logo -->
            <a href="#" class="flex items-center gap-2">

                <i class="fa-solid fa-clapperboard text-red-500 text-2xl"></i>

                <h1 class="text-2xl font-bold text-white">
                    Ciné<span class="text-red-500">Track</span>
                </h1>

            </a>

        </div>

    </header>


    <!-- MAIN -->
    <main class="relative z-10 grid grid-cols-1 md:grid-cols-[85%_15%] min-h-screen">

     <!-- LEFT SIDE: SEARCH + MOVIES -->
<section class="p-6">

    <!-- Search + Filter -->
    <div class="grid grid-cols-1 gap-4 md:grid-cols-3 mb-8">
        <div>
            <input type="text" id="search-film" placeholder="Ex: Game of Thrones..."
                class="w-full rounded-lg border border-gray-300 bg-white p-3 outline-none focus:border-red-500 focus:ring-2 focus:ring-red-200">
        </div>

        <div>
            <select id="filter-status"
                class="w-full rounded-lg border border-gray-300 bg-white p-3 outline-none focus:border-red-500 focus:ring-2 focus:ring-red-200">
                <option value="all">Tous</option>
                <option value="movie">Films</option>
                <option value="series">Séries</option>
            </select>
           

        </div>

        <div>
            <button type="button" id="clear-btn"
                class="w-full rounded-lg bg-red-700 p-3 font-semibold text-white hover:bg-red-800 transition">
                <i class="fa-solid fa-filter mr-2"></i>
                Clear
            </button>
           
        </div>
    </div>

    <!-- Movies Cards -->
    <div id="movies-container"
        class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-5">
    </div>

    <!-- Pagination -->
    <div id="pagination" class="flex justify-center gap-3 mt-8"></div>

    <!-- Modal -->
    <div id="modal"
        class="hidden fixed inset-0 z-50 bg-black/70 items-center justify-center p-4">

        <div class="bg-gray-900 text-white rounded-xl max-w-2xl w-full p-6 relative">

            <button id="close-modal" type="button"
                class="absolute top-3 right-3 text-2xl">
                &times;
            </button>

            <div id="info-container"></div>
        </div>
    </div>

</section>



     
        <aside class="bg-gray-950 border-l border-gray-200 p-4">

           <div class="flex items-center justify-between mb-6">

    <h2 class="text-xl font-bold text-white">
        Favorites
    </h2>

    <i class="fa-solid fa-heart text-2xl"
       style="color: rgb(240, 223, 223);"
       id="9alb"></i>

    <i class="fa-solid fa-toggle-on text-red-700 text-2xl"
    id="active"></i>

</div>

            <!-- Favorites List -->
            <div
                id="favorites-container"
                class="flex flex-col gap-4 hidden">
            

                <!-- Favorites generated with JavaScript -->

            </div>

        </aside>

    </main>
<script type="module" src="js/store.js"></script>
<script type="module" src="js/render.js"></script>
<script type ="module" src="js/modale.js"></script>
<script type ="module" src="js/filter.js"></script>
<script type="module" src="js/Favorites.js"></script>
</body>
</html>
