
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BusDirect - Gestion des réservations de bus.">
    <title>CinéTrack : catalogue de films et séries</title>

    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
</head>

<body>

<header class="bg-gray-950 border-b border-gray-800 px-6 py-4">
  <div class="max-w-7xl mx-auto flex items-center justify-between">

    <!-- Logo -->
    <a href="#" class="flex items-center gap-2">
      <i class="fa-solid fa-clapperboard text-red-500 text-2xl"></i>
      <h1 class="text-2xl font-bold text-white">
        Ciné<span class="text-red-500">Track</span>
      </h1>
    </a>
  </div>
</header>

<main class="grid grid-cols-1 md:grid-cols-[85%_15%] min-h-screen bg-gray-100">

    <!-- LEFT SIDE: SEARCH + MOVIES -->
    <section class="p-6">

      
                <div class="grid grid-cols-1 gap-4 md:grid-cols-3">

                    <div>
                        
                        <input type="text" id="search-film"
                            placeholder="Ex:Game of Thrones"
                            class="w-full rounded-lg border border-gray-300 p-3 outline-none focus:border-red-500 focus:ring-2 focus:ring-red-200">
                    </div>

                    <div>
    
                        <select id="filter-status"
                            class="w-full rounded-lg border border-gray-300 bg-white p-3 outline-none focus:border-red-500 focus:ring-2 focus:ring-red-200">
                            <option value="all">All</option>
                            <option value="series">series</option>
                            <option value="movies">movies</option>
                        </select>
                    </div>

                    <div class="flex items-end">
                        <button type="submit"
                        id="fillter-btn"
                            class="w-full rounded-lg bg-red-700 p-3 font-semibold text-black hover:bg-gray-700">
                            <i class="fa-solid fa-filter mr-2"></i>
                            Filtrer
                        </button>
                    </div>

                </div>


        <!-- Movies Cards -->
        <div id="movies-container"
             class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-5">

            <!-- Cards will be generated with JavaScript -->

        </div>

        <!-- Pagination -->
        <div id="pagination" class="flex justify-center gap-3 mt-8">

        </div>

    </section>


    <!-- RIGHT SIDE: FAVORITES -->
    <aside class="bg-white border-l border-gray-200 p-4">

        <div class="flex items-center justify-between mb-6">

            <h2 class="text-xl font-bold">
                Favorites
            </h2>

            <i class="fa-solid fa-heart text-red-600 text-xl"></i>

        </div>

        <!-- Favorites List -->
        <div id="favorites-container" class="flex flex-col gap-4">

            <!-- Favorites will be generated with JavaScript -->

        </div>

    </aside>

</main>

    
</body>
</html>
